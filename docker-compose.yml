name: legacy

services:
  server:
    build: ./server
    container_name: legacy-server
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-legacy_veiculos_secret_key_2025}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/veiculos"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build: ./client
    container_name: legacy-client
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
